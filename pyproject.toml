[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-commerce-engine"
version = "0.1.0"
description = "Evidence-led ecommerce product intelligence and validation system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.37,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
ai-commerce-seed = "ai_commerce_engine.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_commerce_engine"]

[tool.pytest.ini_options]
addopts = "-q --cov=ai_commerce_engine --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["ai_commerce_engine"]

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true
